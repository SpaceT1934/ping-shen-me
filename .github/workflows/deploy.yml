name: Check and deploy main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ping-shen-me-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python AI service without model calls
        working-directory: apps/ai
        run: |
          python -m pip install -r requirements.txt pytest==8.3.5
          python -m pytest tests -q
      - name: Package and deploy to Tencent Cloud
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/ping-shen-me-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ping-shen-me-deploy" "$HOME/.ssh/known_hosts"
          ssh_args=(-i "$HOME/.ssh/ping-shen-me-deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # Workspace libraries live in production node_modules too. Reuse only
          # when their compiled code and manifests match, not just the lockfile.
          lock_hash=$({
            sha256sum pnpm-lock.yaml packages/contracts/package.json packages/domain/package.json
            find packages/contracts/dist packages/domain/dist -type f -print0 | sort -z | xargs -0 sha256sum
          } | sha256sum | cut -d ' ' -f 1)
          if ssh "${ssh_args[@]}" ubuntu@211.159.160.11 "check-deps $lock_hash"; then
            mode=reuse
          else
            mode=full
          fi
          bash infra/deploy/package-release.sh "$RUNNER_TEMP/ping-shen-me-release.tar.gz" "$mode" "$lock_hash"
          ssh "${ssh_args[@]}" ubuntu@211.159.160.11 "deploy $GITHUB_SHA $mode $lock_hash" < "$RUNNER_TEMP/ping-shen-me-release.tar.gz"
