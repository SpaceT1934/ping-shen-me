name: apple-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apple
      POSTGRES_PASSWORD: apple_local_dev
      POSTGRES_DB: apple
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apple -d apple']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
