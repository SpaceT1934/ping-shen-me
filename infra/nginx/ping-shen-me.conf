server {
    listen 8105 ssl;
    server_name 211.159.160.11;
    ssl_certificate /etc/letsencrypt/live/211.159.160.11/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/211.159.160.11/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Preserve old links while keeping the existing public port.
    error_page 497 =308 https://211.159.160.11:8105$request_uri;
    root /home/ubuntu/ping-shen-me/current/apps/web/dist;
    index index.html;
    client_max_body_size 7m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://127.0.0.1:8106;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
